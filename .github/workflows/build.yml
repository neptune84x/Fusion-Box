name: Fusion-Box Binary Factory
on:
  workflow_dispatch: # Manuel tetikleme için
  push:
    tags:
      - 'v*' # v1.0.0 gibi bir tag basıldığında çalışır

jobs:
  create-universal-bins:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Directories
        run: mkdir -p bin/arm64 bin/x86_64 out

      - name: Download FFmpeg & FFprobe (ARM64)
        run: |
          curl -L https://ffmpeg.martin-riedl.de/download/macos/arm64/1766430132_8.0.1/ffmpeg.zip -o arm_ff.zip
          unzip -o arm_ff.zip -d bin/arm64/
          curl -L https://ffmpeg.martin-riedl.de/download/macos/arm64/1766430132_8.0.1/ffprobe.zip -o arm_pr.zip
          unzip -o arm_pr.zip -d bin/arm64/

      - name: Download FFmpeg & FFprobe (Intel/AMD64)
        run: |
          curl -L https://ffmpeg.martin-riedl.de/download/macos/amd64/1766437297_8.0.1/ffmpeg.zip -o intel_ff.zip
          unzip -o intel_ff.zip -d bin/x86_64/
          curl -L https://ffmpeg.martin-riedl.de/download/macos/amd64/1766437297_8.0.1/ffprobe.zip -o intel_pr.zip
          unzip -o intel_pr.zip -d bin/x86_64/

      - name: Install MP4Box (Universal via Brew)
        run: |
          brew install gpac
          # GitHub Actions macOS Runner (ARM) üzerinde arm64 sürümü gelir
          cp $(which mp4box) bin/arm64/mp4box
          # Intel sürümü için Rosetta üzerinden brew çağrısı (veya mevcut arm/intel ayrımı)
          # Not: Birçok brew paketi artık fat-binary olarak gelir, kontrol ediyoruz.
          cp $(which mp4box) bin/x86_64/mp4box 

      - name: Create Universal Binaries via Lipo
        run: |
          lipo -create bin/arm64/ffmpeg bin/x86_64/ffmpeg -output out/ffmpeg
          lipo -create bin/arm64/ffprobe bin/x86_64/ffprobe -output out/ffprobe
          # MP4Box zaten universal ise kopyalar, değilse hata vermemesi için lipo deneriz
          lipo -create bin/arm64/mp4box bin/x86_64/mp4box -output out/mp4box || cp bin/arm64/mp4box out/mp4box
          
          chmod +x out/*

      - name: Verify Architectures
        run: |
          file out/ffmpeg
          file out/ffprobe
          file out/mp4box

      - name: Create Release Assets
        run: |
          cd out
          zip -r ../fusion-universal-bins.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fusion-universal-bins.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
