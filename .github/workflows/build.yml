name: Build macOS Universal Binaries

on:
  workflow_dispatch:
  schedule:
    # Her gün gece 02:00 UTC'de çalışır
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  build:
    name: Build Universal Binaries
    runs-on: macos-latest

    steps:
      # ──────────────────────────────────────────────────────────────────
      # 1. FFmpeg & FFprobe — iki ayrı kaynaktan indir
      #
      #   x86_64 (Intel)   → evermeet.cx  (sadece Intel, ZIP)
      #   arm64  (Silicon)  → ffmpeg.martin-riedl.de  (arm64, ZIP)
      #
      #   Her iki kaynak da doğrulanmış çalışan permalink URL'lere sahip.
      # ──────────────────────────────────────────────────────────────────
      - name: Download FFmpeg & FFprobe (x86_64 + arm64)
        run: |
          set -euo pipefail
          mkdir -p binaries/x86_64 binaries/arm64

          # ── x86_64: evermeet.cx ───────────────────────────────────────
          # https://evermeet.cx/ffmpeg/#api — getrelease endpoint
          echo "Downloading ffmpeg x86_64 (evermeet.cx)..."
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" \
               -o /tmp/ffmpeg_x86.zip
          echo "Downloading ffprobe x86_64 (evermeet.cx)..."
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" \
               -o /tmp/ffprobe_x86.zip

          unzip -oq /tmp/ffmpeg_x86.zip  -d /tmp/ffmpeg_x86_dir
          unzip -oq /tmp/ffprobe_x86.zip -d /tmp/ffprobe_x86_dir

          cp /tmp/ffmpeg_x86_dir/ffmpeg   binaries/x86_64/ffmpeg
          cp /tmp/ffprobe_x86_dir/ffprobe binaries/x86_64/ffprobe

          # ── arm64: ffmpeg.martin-riedl.de ────────────────────────────
          # https://ffmpeg.martin-riedl.de/ — permalink format:
          # /redirect/latest/macos/arm64/release/<binary>.zip
          echo "Downloading ffmpeg arm64 (martin-riedl.de)..."
          curl -fsSL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" \
               -o /tmp/ffmpeg_arm.zip
          echo "Downloading ffprobe arm64 (martin-riedl.de)..."
          curl -fsSL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" \
               -o /tmp/ffprobe_arm.zip

          unzip -oq /tmp/ffmpeg_arm.zip  -d /tmp/ffmpeg_arm_dir
          unzip -oq /tmp/ffprobe_arm.zip -d /tmp/ffprobe_arm_dir

          # martin-riedl ZIP içinde binary doğrudan veya alt klasörde olabilir
          FFMPEG_ARM=$(find /tmp/ffmpeg_arm_dir  -maxdepth 2 -type f -name "ffmpeg"  | head -1)
          FFPROBE_ARM=$(find /tmp/ffprobe_arm_dir -maxdepth 2 -type f -name "ffprobe" | head -1)

          if [ -z "$FFMPEG_ARM" ]; then
            echo "arm64 ffmpeg binary ZIP'ten cikarilamadi!"
            ls -laR /tmp/ffmpeg_arm_dir
            exit 1
          fi
          if [ -z "$FFPROBE_ARM" ]; then
            echo "arm64 ffprobe binary ZIP'ten cikarilamadi!"
            ls -laR /tmp/ffprobe_arm_dir
            exit 1
          fi

          cp "$FFMPEG_ARM"  binaries/arm64/ffmpeg
          cp "$FFPROBE_ARM" binaries/arm64/ffprobe

          echo ""
          echo "=== Indirilen binary mimari bilgileri ==="
          file binaries/x86_64/ffmpeg binaries/x86_64/ffprobe
          file binaries/arm64/ffmpeg  binaries/arm64/ffprobe

      # ──────────────────────────────────────────────────────────────────
      # 2. Sürüm bilgilerini al
      # ──────────────────────────────────────────────────────────────────
      - name: Get version info
        id: versions
        run: |
          set -euo pipefail

          FFMPEG_VER=$(curl -fsSL "https://evermeet.cx/ffmpeg/info/ffmpeg/release" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" \
            2>/dev/null || echo "unknown")

          echo "ffmpeg_version=$FFMPEG_VER" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)"   >> "$GITHUB_OUTPUT"
          echo "FFmpeg version: $FFMPEG_VER"

      # ──────────────────────────────────────────────────────────────────
      # 3. MP4Box — GPAC nightly .pkg'den binary çıkar
      #
      #   GPAC macOS nightly PKG permalink:
      #   https://download.tsi.telecom-paristech.fr/gpac/new_builds/gpac_latest_head_macos.pkg
      #
      #   PKG = xar arşivi; içinden Payload (cpio.gz) çıkarılır.
      #   GPAC genellikle universal binary (arm64+x86_64) ile gelir.
      # ──────────────────────────────────────────────────────────────────
      - name: Download and extract MP4Box from GPAC nightly pkg
        run: |
          set -euo pipefail

          GPAC_URL="https://download.tsi.telecom-paristech.fr/gpac/new_builds/gpac_latest_head_macos.pkg"

          echo "Downloading GPAC nightly pkg..."
          curl -fsSL "$GPAC_URL" -o /tmp/gpac.pkg

          echo "Expanding pkg..."
          pkgutil --expand /tmp/gpac.pkg /tmp/gpac_expanded

          # Payload dosyasını bul
          PAYLOAD=$(find /tmp/gpac_expanded -name "Payload" | head -1)
          if [ -z "$PAYLOAD" ]; then
            echo "Payload bulunamadi! PKG icerigi:"
            find /tmp/gpac_expanded -type f
            exit 1
          fi
          echo "Payload: $PAYLOAD"

          # Payload = gzip'li cpio arşivi
          mkdir -p /tmp/gpac_root
          cd /tmp/gpac_root
          cat "$PAYLOAD" | gunzip -dc | cpio -idmu 2>/dev/null || true

          # MP4Box binary'yi bul
          MP4BOX_PATH=$(find /tmp/gpac_root -name "MP4Box" -type f | head -1)
          if [ -z "$MP4BOX_PATH" ]; then
            echo "MP4Box binary bulunamadi! Payload icerigi:"
            find /tmp/gpac_root -type f | head -40
            exit 1
          fi

          echo "MP4Box bulundu: $MP4BOX_PATH"
          chmod +x "$MP4BOX_PATH"
          file "$MP4BOX_PATH"

          MP4BOX_ARCHS=$(lipo -archs "$MP4BOX_PATH" 2>/dev/null || echo "unknown")
          echo "MP4Box archs: $MP4BOX_ARCHS"

          if [[ "$MP4BOX_ARCHS" == *"arm64"* ]] && [[ "$MP4BOX_ARCHS" == *"x86_64"* ]]; then
            # Zaten universal — her iki klasöre kopyala (lipo adiminda slim edilecek)
            echo "MP4Box zaten universal binary - her iki dizine kopyalaniyor"
            cp "$MP4BOX_PATH" binaries/arm64/MP4Box
            cp "$MP4BOX_PATH" binaries/x86_64/MP4Box
          elif [[ "$MP4BOX_ARCHS" == *"arm64"* ]]; then
            echo "MP4Box yalnizca arm64 - x86_64 icin brew kullanilacak"
            cp "$MP4BOX_PATH" binaries/arm64/MP4Box
            brew install gpac
            cp "$(brew --prefix gpac)/bin/MP4Box" binaries/x86_64/MP4Box
          elif [[ "$MP4BOX_ARCHS" == *"x86_64"* ]]; then
            echo "MP4Box yalnizca x86_64 - arm64 icin brew kullanilacak"
            cp "$MP4BOX_PATH" binaries/x86_64/MP4Box
            brew install gpac
            cp "$(brew --prefix gpac)/bin/MP4Box" binaries/arm64/MP4Box
          else
            echo "Bilinmeyen MP4Box arch: $MP4BOX_ARCHS - brew fallback"
            brew install gpac
            BREW_MP4BOX="$(brew --prefix gpac)/bin/MP4Box"
            cp "$BREW_MP4BOX" binaries/arm64/MP4Box
            cp "$BREW_MP4BOX" binaries/x86_64/MP4Box
          fi

          echo ""
          echo "=== MP4Box binary mimari bilgileri ==="
          file binaries/x86_64/MP4Box binaries/arm64/MP4Box

      # ──────────────────────────────────────────────────────────────────
      # 4. lipo → Universal Binary oluştur
      # ──────────────────────────────────────────────────────────────────
      - name: Create universal binaries with lipo
        run: |
          set -euo pipefail
          mkdir -p universal

          for BIN in ffmpeg ffprobe MP4Box; do
            ARM="binaries/arm64/$BIN"
            X86="binaries/x86_64/$BIN"
            OUT="universal/$BIN"

            echo ""
            echo "== $BIN =="

            [ -f "$ARM" ] || { echo "Eksik: $ARM"; exit 1; }
            [ -f "$X86" ] || { echo "Eksik: $X86"; exit 1; }

            chmod +x "$ARM" "$X86"

            ARM_ARCHS=$(lipo -archs "$ARM" 2>/dev/null || echo "unknown")
            X86_ARCHS=$(lipo -archs "$X86" 2>/dev/null || echo "unknown")
            echo "  arm binary archs : $ARM_ARCHS"
            echo "  x86 binary archs : $X86_ARCHS"

            # Her iki taraf da zaten universal ise, arm kopyasını al
            if [[ "$ARM_ARCHS" == *"arm64"* && "$ARM_ARCHS" == *"x86_64"* ]]; then
              echo "  -> arm binary zaten universal, direkt kullaniliyor"
              cp "$ARM" "$OUT"

            elif [[ "$X86_ARCHS" == *"arm64"* && "$X86_ARCHS" == *"x86_64"* ]]; then
              echo "  -> x86 binary zaten universal, direkt kullaniliyor"
              cp "$X86" "$OUT"

            else
              # lipo gerekiyor; her binary yalnizca kendi arch'ini icermeli
              # Fazla slice varsa thin out yap
              LIPO_ARM="$ARM"
              LIPO_X86="$X86"

              if [[ "$ARM_ARCHS" == *"x86_64"* ]]; then
                lipo "$ARM" -thin arm64 -output /tmp/${BIN}_arm_only
                LIPO_ARM="/tmp/${BIN}_arm_only"
                echo "  arm binary'den sadece arm64 slice alindi"
              fi
              if [[ "$X86_ARCHS" == *"arm64"* ]]; then
                lipo "$X86" -thin x86_64 -output /tmp/${BIN}_x86_only
                LIPO_X86="/tmp/${BIN}_x86_only"
                echo "  x86 binary'den sadece x86_64 slice alindi"
              fi

              echo "  -> lipo ile birlestiriliyor..."
              lipo -create -output "$OUT" "$LIPO_ARM" "$LIPO_X86"
            fi

            chmod +x "$OUT"
            RESULT_ARCHS=$(lipo -archs "$OUT")
            echo "  Sonuc archs: $RESULT_ARCHS"

            if [[ "$RESULT_ARCHS" != *"arm64"* ]] || [[ "$RESULT_ARCHS" != *"x86_64"* ]]; then
              echo "HATA: $BIN universal degil!"
              exit 1
            fi
            echo "  OK: $BIN universal binary olusturuldu"
          done

      # ──────────────────────────────────────────────────────────────────
      # 5. Doğrulama
      # ──────────────────────────────────────────────────────────────────
      - name: Verify universal binaries
        run: |
          echo "========================================"
          echo "  Universal Binary Dogrulama"
          echo "========================================"
          for BIN in ffmpeg ffprobe MP4Box; do
            echo ""
            echo "-- $BIN --"
            file universal/$BIN
            lipo -info universal/$BIN
          done

          echo ""
          echo "-- Calisma testi (native arch) --"
          ./universal/ffmpeg  -version 2>&1 | head -1
          ./universal/ffprobe -version 2>&1 | head -1
          ./universal/MP4Box  -version 2>&1 | head -1 || true

      # ──────────────────────────────────────────────────────────────────
      # 6. Paketleme
      # ──────────────────────────────────────────────────────────────────
      - name: Package binaries
        run: |
          cd universal
          zip ../ffmpeg-universal-macos.zip   ffmpeg
          zip ../ffprobe-universal-macos.zip  ffprobe
          zip ../MP4Box-universal-macos.zip   MP4Box
          zip ../media-tools-universal-macos.zip ffmpeg ffprobe MP4Box
          cd ..

          echo "Paket boyutlari:"
          ls -lh ffmpeg-universal-macos.zip \
                 ffprobe-universal-macos.zip \
                 MP4Box-universal-macos.zip \
                 media-tools-universal-macos.zip

      # ──────────────────────────────────────────────────────────────────
      # 7. Eski "latest" release ve tag'i temizle
      # ──────────────────────────────────────────────────────────────────
      - name: Delete old latest release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────────────────
      # 8. Yeni "latest" release yayınla
      # ──────────────────────────────────────────────────────────────────
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest macOS Universal Build (${{ steps.versions.outputs.date }})"
          body: |
            ## macOS Universal Binaries — arm64 (Apple Silicon) + x86_64 (Intel)

            | Binary  | Sürüm                                        |
            |---------|----------------------------------------------|
            | ffmpeg  | ${{ steps.versions.outputs.ffmpeg_version }} |
            | ffprobe | ${{ steps.versions.outputs.ffmpeg_version }} |
            | MP4Box  | GPAC nightly                                 |

            **Kaynaklar:**
            - ffmpeg/ffprobe x86_64 → [evermeet.cx](https://evermeet.cx/ffmpeg/)
            - ffmpeg/ffprobe arm64  → [ffmpeg.martin-riedl.de](https://ffmpeg.martin-riedl.de/)
            - MP4Box               → [GPAC nightly](https://gpac.io/downloads/gpac-nightly-builds/)

            ### Hızlı kurulum
            ```bash
            curl -Lo tools.zip \
              https://github.com/${{ github.repository }}/releases/download/latest/media-tools-universal-macos.zip
            unzip tools.zip
            chmod +x ffmpeg ffprobe MP4Box
            xattr -dr com.apple.quarantine ffmpeg ffprobe MP4Box
            ./ffmpeg -version
            ```

            > Binary'ler hem Apple Silicon (M1/M2/M3/M4) hem Intel Mac'lerde native çalışır.
          prerelease: false
          make_latest: true
          files: |
            ffmpeg-universal-macos.zip
            ffprobe-universal-macos.zip
            MP4Box-universal-macos.zip
            media-tools-universal-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
