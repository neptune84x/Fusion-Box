name: Build Universal Tools
on: 
  push:
    branches: [main]

jobs:
  build-universal:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Directories
        run: mkdir -p bin/arm64 bin/x86_64 out

      - name: Download FFmpeg & FFprobe (User Provided)
        run: |
          # ARM64
          curl -L https://ffmpeg.martin-riedl.de/download/macos/arm64/1766430132_8.0.1/ffmpeg.zip -o arm_ff.zip
          unzip -o arm_ff.zip -d bin/arm64/
          curl -L https://ffmpeg.martin-riedl.de/download/macos/arm64/1766430132_8.0.1/ffprobe.zip -o arm_pr.zip
          unzip -o arm_pr.zip -d bin/arm64/
          # Intel
          curl -L https://ffmpeg.martin-riedl.de/download/macos/amd64/1766437297_8.0.1/ffmpeg.zip -o intel_ff.zip
          unzip -o intel_ff.zip -d bin/x86_64/
          curl -L https://ffmpeg.martin-riedl.de/download/macos/amd64/1766437297_8.0.1/ffprobe.zip -o intel_pr.zip
          unzip -o intel_pr.zip -d bin/x86_64/

      - name: Build MP4Box (Static & Portable)
        run: |
          git clone --depth 1 https://github.com/gpac/gpac.git gpac_source
          
          # --- ARM64 DERLEMESİ ---
          cp -R gpac_source gpac_arm64 && cd gpac_arm64
          # Logdaki 'revision.h' hatasını manuel çözüyoruz
          mkdir -p include/gpac
          echo '#define GPAC_REVISION "master"' > include/gpac/revision.h
          
          # Tanınmayan 'gl' ve 'graphics' yerine güncel bayrakları kullanıyoruz
          ./configure --static-bin --disable-x11 --disable-ffmpeg --enable-vtt \
            --extra-cflags="-arch arm64" --extra-ldflags="-arch arm64"
          make -j$(sysctl -n hw.ncpu)
          cp bin/gcc/MP4Box ../bin/arm64/mp4box || cp bin/gcc/mp4box ../bin/arm64/mp4box
          cd ..

          # --- INTEL (X86_64) DERLEMESİ ---
          cp -R gpac_source gpac_x86_64 && cd gpac_x86_64
          mkdir -p include/gpac
          echo '#define GPAC_REVISION "master"' > include/gpac/revision.h
          
          ./configure --static-bin --disable-x11 --disable-ffmpeg --enable-vtt \
            --extra-cflags="-arch x86_64" --extra-ldflags="-arch x86_64"
          make -j$(sysctl -n hw.ncpu)
          cp bin/gcc/MP4Box ../bin/x86_64/mp4box || cp bin/gcc/mp4box ../bin/x86_64/mp4box
          cd ..

      - name: Create Universal Binaries (Lipo)
        run: |
          lipo -create bin/arm64/ffmpeg bin/x86_64/ffmpeg -output out/ffmpeg
          lipo -create bin/arm64/ffprobe bin/x86_64/ffprobe -output out/ffprobe
          lipo -create bin/arm64/mp4box bin/x86_64/mp4box -output out/mp4box
          chmod +x out/*
          
          echo "Doğrulama:"
          file out/mp4box
          # Kütüphane bağımlılığını kontrol et (Sadece sistem dylibleri kalmalı)
          otool -L out/mp4box

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "out/*"
          tag: "latest"
          name: "Fusion Universal Tools"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
