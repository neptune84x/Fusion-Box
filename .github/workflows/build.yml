name: Build Universal Tools
on: [push]

jobs:
  build-universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Create Directories
        run: mkdir -p bin/arm64 bin/x86_64 out

      - name: Download FFmpeg & FFprobe (Pre-built)
        run: |
          # ARM64 için FFmpeg
          curl -L https://ffmpeg.martin-riedl.de/download/macos/arm64/1766430132_8.0.1/ffmpeg.zip -o arm_ff.zip
          unzip -o arm_ff.zip -d bin/arm64/
          curl -L https://ffmpeg.martin-riedl.de/download/macos/arm64/1766430132_8.0.1/ffprobe.zip -o arm_pr.zip
          unzip -o arm_pr.zip -d bin/arm64/
          
          # Intel için FFmpeg
          curl -L https://ffmpeg.martin-riedl.de/download/macos/amd64/1766437297_8.0.1/ffmpeg.zip -o intel_ff.zip
          unzip -o intel_ff.zip -d bin/x86_64/
          curl -L https://ffmpeg.martin-riedl.de/download/macos/amd64/1766437297_8.0.1/ffprobe.zip -o intel_pr.zip
          unzip -o intel_pr.zip -d bin/x86_64/

      - name: Build MP4Box (Clean Multi-Arch Build)
        run: |
          # GPAC kaynak kodunu indir
          git clone --depth 1 https://github.com/gpac/gpac.git gpac_source
          
          # 1. ARM64 DERLEMESİ (Tamamen izole klasör)
          cp -r gpac_source gpac_arm64
          cd gpac_arm64
          # Uyarı veren --disable-opengl kaldırıldı, yerine --disable-graphics eklendi (daha kapsamlı temizlik)
          ./configure --static-bin --disable-x11 --disable-graphics --disable-ffmpeg \
            --enable-vtt --prefix=./inst \
            --extra-cflags="-arch arm64" --extra-ldflags="-arch arm64"
          make -j$(sysctl -n hw.ncpu)
          cp bin/gcc/mp4box ../bin/arm64/
          cd ..
          
          # 2. Intel (x86_64) DERLEMESİ (Tamamen izole klasör)
          cp -r gpac_source gpac_x86_64
          cd gpac_x86_64
          ./configure --static-bin --disable-x11 --disable-graphics --disable-ffmpeg \
            --enable-vtt --prefix=./inst \
            --extra-cflags="-arch x86_64" --extra-ldflags="-arch x86_64"
          make -j$(sysctl -n hw.ncpu)
          cp bin/gcc/mp4box ../bin/x86_64/
          cd ..

      - name: Create Universal Binaries (Lipo)
        run: |
          # İki mimariyi birleştir
          lipo -create bin/arm64/ffmpeg bin/x86_64/ffmpeg -output out/ffmpeg
          lipo -create bin/arm64/ffprobe bin/x86_64/ffprobe -output out/ffprobe
          lipo -create bin/arm64/mp4box bin/x86_64/mp4box -output out/mp4box
          
          chmod +x out/*
          
          echo "Universal Binary Check:"
          file out/ffmpeg
          file out/mp4box

      - name: Upload Universal Tools
        uses: actions/upload-artifact@v4
        with:
          name: universal-multimedia-tools
          path: out/
