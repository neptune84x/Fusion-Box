name: Build macOS Universal Binaries

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:

  build-arch:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/out"

      # ── FFmpeg & FFprobe ──────────────────────────────────────────
      - name: Download FFmpeg & FFprobe (${{ matrix.arch }})
        run: |
          set -euo pipefail

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            BASE="https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release"
            curl -fsSL "$BASE/ffmpeg.zip"  -o /tmp/ffmpeg.zip
            curl -fsSL "$BASE/ffprobe.zip" -o /tmp/ffprobe.zip
          else
            curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"  -o /tmp/ffmpeg.zip
            curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o /tmp/ffprobe.zip
          fi

          unzip -oq /tmp/ffmpeg.zip  -d /tmp/ffmpeg_dir
          unzip -oq /tmp/ffprobe.zip -d /tmp/ffprobe_dir

          FFMPEG_BIN=$(find  /tmp/ffmpeg_dir  -maxdepth 3 -type f -name "ffmpeg"  | head -1)
          FFPROBE_BIN=$(find /tmp/ffprobe_dir -maxdepth 3 -type f -name "ffprobe" | head -1)

          [ -n "$FFMPEG_BIN"  ] || { echo "ffmpeg bulunamadi!";  ls -laR /tmp/ffmpeg_dir;  exit 1; }
          [ -n "$FFPROBE_BIN" ] || { echo "ffprobe bulunamadi!"; ls -laR /tmp/ffprobe_dir; exit 1; }

          chmod +x "$FFMPEG_BIN" "$FFPROBE_BIN"
          cp "$FFMPEG_BIN"  "$GITHUB_WORKSPACE/out/ffmpeg"
          cp "$FFPROBE_BIN" "$GITHUB_WORKSPACE/out/ffprobe"

          echo "ffmpeg  arch: $(lipo -archs $GITHUB_WORKSPACE/out/ffmpeg)"
          echo "ffprobe arch: $(lipo -archs $GITHUB_WORKSPACE/out/ffprobe)"

      # ── MP4Box ────────────────────────────────────────────────────
      #
      # Sorun: GPAC configure, brew'daki libpng / libnghttp2 / freetype /
      #        openssl'ı bulunca dinamik bağlar. --static-bin macOS'ta
      #        "cannot remove all dependencies" der, kütüphaneleri yine bağlar.
      #
      # Çözüm: Sorunlu brew paketlerini configure ÖNCE tamamen uninstall et.
      #        GPAC configure kütüphaneyi bulamazsa o özelliği kapatır.
      #        Sonuç: yalnızca macOS system lib'lerine (/usr/lib, /System) bağlı binary.
      #
      # Kaldırılan paketler ve etkileri:
      #   libpng     → PNG desteği kapanır (MP4Box için kritik değil)
      #   libnghttp2 → HTTP/2 desteği kapanır
      #   openssl@3  → TLS desteği kapanır (MP4Box CLI için yeterli)
      #   freetype   → font render kapanır (MP4Box text overlay yok)
      #
      - name: Remove brew packages that cause dynamic linking
        run: |
          set -euo pipefail
          # --ignore-dependencies: bağımlı paketleri de kaldırmaya uğraşmaz
          # 2>/dev/null || true: paket yoksa sessizce devam et
          for pkg in libpng libnghttp2 nghttp2 openssl openssl@3 freetype freetype2; do
            brew uninstall --ignore-dependencies "$pkg" 2>/dev/null || true
          done

          echo "=== Kalan pkg-config durumu ==="
          pkg-config --exists libpng     && echo "libpng    : HALA MEVCUT" || echo "libpng    : kaldırıldı"
          pkg-config --exists libnghttp2 && echo "libnghttp2: HALA MEVCUT" || echo "libnghttp2: kaldırıldı"
          pkg-config --exists openssl    && echo "openssl   : HALA MEVCUT" || echo "openssl   : kaldırıldı"
          pkg-config --exists freetype2  && echo "freetype  : HALA MEVCUT" || echo "freetype  : kaldırıldı"

      - name: Build MP4Box from source (static-bin)
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/gpac/gpac.git /tmp/gpac
          cd /tmp/gpac

          echo "=== Configure ==="
          ./configure --static-bin 2>&1 | tail -20

          echo ""
          echo "=== config.mak: PNG / NGHTTP2 / SSL / FREETYPE durumu ==="
          grep -iE "(png|nghttp2|ssl|freetype|curl)" config.mak || echo "(hic eslesme yok — iyi)"

          echo ""
          echo "=== Derleme ==="
          make -j$(sysctl -n hw.logicalcpu) 2>&1 | tail -30

          MP4BOX_BIN="bin/gcc/MP4Box"
          [ -f "$MP4BOX_BIN" ] || {
            echo "MP4Box derleme basarisiz!"
            find bin/ -type f 2>/dev/null | head -20
            exit 1
          }

          chmod +x "$MP4BOX_BIN"
          cp "$MP4BOX_BIN" "$GITHUB_WORKSPACE/out/MP4Box"

          echo ""
          echo "=== MP4Box dinamik bağımlılıkları ==="
          otool -L "$GITHUB_WORKSPACE/out/MP4Box"

          echo ""
          echo "=== Taşınamaz bağımlılık kontrolü ==="
          FORBIDDEN=$(otool -L "$GITHUB_WORKSPACE/out/MP4Box" \
            | tail -n +2 \
            | awk '{print $1}' \
            | grep -v "^/usr/lib" \
            | grep -v "^/System" \
            | grep -v "^/lib" \
            || true)

          if [ -n "$FORBIDDEN" ]; then
            echo "HATA: Asagidaki bagimliliklar tasinamaz:"
            echo "$FORBIDDEN"
            exit 1
          fi

          echo "OK: Tum bagimliliklar macOS system library."
          echo "arch: $(lipo -archs $GITHUB_WORKSPACE/out/MP4Box)"

      - name: Verify binaries (${{ matrix.arch }})
        run: |
          for BIN in ffmpeg ffprobe MP4Box; do
            echo "-- $BIN --"
            file "$GITHUB_WORKSPACE/out/$BIN"
            lipo -archs "$GITHUB_WORKSPACE/out/$BIN"
            "$GITHUB_WORKSPACE/out/$BIN" -version 2>&1 | head -1 || true
            echo ""
          done

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: out/
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────
  # JOB 2: Universal binary oluştur ve release yayınla
  # ────────────────────────────────────────────────────────────────────
  create-universal:
    name: Create Universal & Publish Release
    needs: build-arch
    runs-on: macos-latest

    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries-arm64
          path: binaries/arm64

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries-x86_64
          path: binaries/x86_64

      - name: Show downloaded binaries
        run: |
          echo "=== arm64 ===" && file binaries/arm64/*
          echo "=== x86_64 ===" && file binaries/x86_64/*

      - name: Create universal binaries with lipo
        run: |
          set -euo pipefail
          mkdir -p universal

          for BIN in ffmpeg ffprobe MP4Box; do
            ARM="binaries/arm64/$BIN"
            X86="binaries/x86_64/$BIN"
            OUT="universal/$BIN"

            echo "== $BIN =="
            [ -f "$ARM" ] || { echo "Eksik: $ARM"; exit 1; }
            [ -f "$X86" ] || { echo "Eksik: $X86"; exit 1; }
            chmod +x "$ARM" "$X86"

            ARM_ARCHS=$(lipo -archs "$ARM" 2>/dev/null || echo "unknown")
            X86_ARCHS=$(lipo -archs "$X86" 2>/dev/null || echo "unknown")
            echo "  arm : $ARM_ARCHS"
            echo "  x86 : $X86_ARCHS"

            if [[ "$ARM_ARCHS" == *"arm64"* && "$ARM_ARCHS" == *"x86_64"* ]]; then
              cp "$ARM" "$OUT"
            elif [[ "$X86_ARCHS" == *"arm64"* && "$X86_ARCHS" == *"x86_64"* ]]; then
              cp "$X86" "$OUT"
            else
              LIPO_ARM="$ARM"
              LIPO_X86="$X86"
              if [[ "$ARM_ARCHS" == *"x86_64"* ]]; then
                lipo "$ARM" -thin arm64 -output /tmp/${BIN}_arm_only
                LIPO_ARM="/tmp/${BIN}_arm_only"
              fi
              if [[ "$X86_ARCHS" == *"arm64"* ]]; then
                lipo "$X86" -thin x86_64 -output /tmp/${BIN}_x86_only
                LIPO_X86="/tmp/${BIN}_x86_only"
              fi
              lipo -create -output "$OUT" "$LIPO_ARM" "$LIPO_X86"
            fi

            chmod +x "$OUT"
            RESULT=$(lipo -archs "$OUT")
            echo "  sonuc: $RESULT"
            [[ "$RESULT" == *"arm64"* && "$RESULT" == *"x86_64"* ]] \
              || { echo "HATA: $BIN universal degil!"; exit 1; }
            echo ""
          done

      - name: Verify universal binaries
        run: |
          for BIN in ffmpeg ffprobe MP4Box; do
            echo "-- $BIN --"
            file "universal/$BIN"
            lipo -info "universal/$BIN"
            echo "Bagimliliklar:"
            otool -L "universal/$BIN" | tail -n +2 | awk '{print "  "$1}'
            echo ""
          done
          echo "-- Calisma testleri --"
          ./universal/ffmpeg  -version 2>&1 | head -1
          ./universal/ffprobe -version 2>&1 | head -1
          ./universal/MP4Box  -version 2>&1 | head -1 || true

      - name: Package binaries
        run: |
          cd universal
          zip ../ffmpeg-universal-macos.zip          ffmpeg
          zip ../ffprobe-universal-macos.zip         ffprobe
          zip ../MP4Box-universal-macos.zip          MP4Box
          zip ../media-tools-universal-macos.zip     ffmpeg ffprobe MP4Box
          cd ..
          ls -lh *-universal-macos.zip

      - name: Delete old latest release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version info
        id: ver
        run: |
          FFMPEG_VER=$(./universal/ffmpeg -version 2>&1 | grep "ffmpeg version" | awk '{print $3}' || echo "unknown")
          MP4BOX_VER=$(./universal/MP4Box -version 2>&1 | head -1 || echo "nightly")
          echo "ffmpeg_ver=$FFMPEG_VER"  >> "$GITHUB_OUTPUT"
          echo "mp4box_ver=$MP4BOX_VER"  >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest macOS Universal Build (${{ steps.ver.outputs.date }})"
          body: |
            ## macOS Universal Binaries — arm64 (Apple Silicon) + x86_64 (Intel)

            | Binary  | Versiyon                              | Notlar                            |
            |---------|---------------------------------------|-----------------------------------|
            | ffmpeg  | `${{ steps.ver.outputs.ffmpeg_ver }}` | evermeet.cx + martin-riedl.de     |
            | ffprobe | `${{ steps.ver.outputs.ffmpeg_ver }}` | evermeet.cx + martin-riedl.de     |
            | MP4Box  | `${{ steps.ver.outputs.mp4box_ver }}` | GPAC kaynak, sıfır dış bağımlılık |

            > **MP4Box** kaynak koddan `--static-bin` ile derlendi — dış `.dylib` bağımlılığı yoktur.

            ### Hızlı kurulum
            ```bash
            curl -Lo tools.zip \
              https://github.com/${{ github.repository }}/releases/download/latest/media-tools-universal-macos.zip
            unzip tools.zip -d media-tools
            cd media-tools
            chmod +x ffmpeg ffprobe MP4Box
            xattr -dr com.apple.quarantine ffmpeg ffprobe MP4Box
            ./MP4Box -version
            ./ffmpeg -version
            ```

            > Binary'ler hem Apple Silicon (M1/M2/M3/M4) hem Intel Mac'lerde native çalışır.
          prerelease: false
          make_latest: true
          files: |
            ffmpeg-universal-macos.zip
            ffprobe-universal-macos.zip
            MP4Box-universal-macos.zip
            media-tools-universal-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
