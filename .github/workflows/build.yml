- name: Build GPAC (MP4Box)
        run: |
          # Temiz kaynak kodu çekelim
          git clone --depth 1 https://github.com/gpac/gpac.git gpac_source
          
          # --- ARM64 Derlemesi ---
          cp -R gpac_source gpac_arm64
          cd gpac_arm64
          mkdir -p include/gpac
          
          # GPAC özel yapılandırması: --host kullanılmaz, mimari cflags ile verilir
          ./configure --static-bin \
            --disable-x11 \
            --disable-gl \
            --disable-graphics \
            --disable-ffmpeg \
            --enable-vtt \
            --extra-cflags="-arch arm64" \
            --extra-ldflags="-arch arm64"
          
          make -j$(sysctl -n hw.ncpu)
          # Binary adı MP4Box veya mp4box olabilir, ikisini de kontrol et
          cp bin/gcc/MP4Box ../bin/arm64/mp4box || cp bin/gcc/mp4box ../bin/arm64/mp4box
          cd ..

          # --- x86_64 Derlemesi ---
          cp -R gpac_source gpac_x86_64
          cd gpac_x86_64
          mkdir -p include/gpac
          
          ./configure --static-bin \
            --disable-x11 \
            --disable-gl \
            --disable-graphics \
            --disable-ffmpeg \
            --enable-vtt \
            --extra-cflags="-arch x86_64" \
            --extra-ldflags="-arch x86_64"
          
          make -j$(sysctl -n hw.ncpu)
          cp bin/gcc/MP4Box ../bin/x86_64/mp4box || cp bin/gcc/mp4box ../bin/x86_64/mp4box
          cd ..

      - name: Create Universal Binaries (Lipo)
        run: |
          # Mimari birleştirme
          lipo -create bin/arm64/ffmpeg bin/x86_64/ffmpeg -output out/ffmpeg
          lipo -create bin/arm64/ffprobe bin/x86_64/ffprobe -output out/ffprobe
          lipo -create bin/arm64/mp4box bin/x86_64/mp4box -output out/mp4box
          
          chmod +x out/*
          
          echo "Universal Binary Check:"
          file out/mp4box
          out/mp4box -version
