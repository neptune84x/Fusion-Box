name: Build Universal Tools with Brew
on: [push]

jobs:
  build-universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Create Directories
        run: mkdir -p bin/arm64 bin/x86_64 out

      - name: Install Tools via Brew (Native ARM64)
        run: |
          # Mevcut runner (ARM64) üzerinde araçları kur
          brew install ffmpeg gpac
          
          # Binary yollarını kopyala
          cp $(which ffmpeg) bin/arm64/ffmpeg
          cp $(which ffprobe) bin/arm64/ffprobe
          cp $(which mp4box) bin/arm64/mp4box

      - name: Install Tools via Brew (Rosetta x86_64)
        run: |
          # x86_64 (Intel) mimarisi için Rosetta üzerinden brew kurulumu
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install ffmpeg gpac
          
          # Intel binary yollarını kopyala (/usr/local/bin altında oluşur)
          cp /usr/local/bin/ffmpeg bin/x86_64/ffmpeg
          cp /usr/local/bin/ffprobe bin/x86_64/ffprobe
          cp /usr/local/bin/mp4box bin/x86_64/mp4box

      - name: Create Universal Binaries (Lipo)
        run: |
          # İki farklı dünyayı birleştirme
          lipo -create bin/arm64/ffmpeg bin/x86_64/ffmpeg -output out/ffmpeg
          lipo -create bin/arm64/ffprobe bin/x86_64/ffprobe -output out/ffprobe
          lipo -create bin/arm64/mp4box bin/x86_64/mp4box -output out/mp4box
          
          chmod +x out/*
          
          echo "Doğrulama Yapılıyor:"
          file out/ffmpeg
          file out/mp4box
          
          out/ffmpeg -version | head -n 1
          out/mp4box -version | head -n 1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Tools-Brew
          path: out/
