name: Build Universal Tools
on: [push]

jobs:
  build-universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Create Directories
        run: mkdir -p bin/arm64 bin/x86_64 out

      - name: Download FFmpeg & FFprobe (User Provided Links)
        run: |
          # ARM64 (Apple Silicon) - Senin sağladığın linkler
          curl -L https://ffmpeg.martin-riedl.de/download/macos/arm64/1766430132_8.0.1/ffmpeg.zip -o arm_ff.zip
          unzip -o arm_ff.zip -d bin/arm64/
          curl -L https://ffmpeg.martin-riedl.de/download/macos/arm64/1766430132_8.0.1/ffprobe.zip -o arm_pr.zip
          unzip -o arm_pr.zip -d bin/arm64/
          
          # Intel (x86_64) - Senin sağladığın linkler
          curl -L https://ffmpeg.martin-riedl.de/download/macos/amd64/1766437297_8.0.1/ffmpeg.zip -o intel_ff.zip
          unzip -o intel_ff.zip -d bin/x86_64/
          curl -L https://ffmpeg.martin-riedl.de/download/macos/amd64/1766437297_8.0.1/ffprobe.zip -o intel_pr.zip
          unzip -o intel_pr.zip -d bin/x86_64/

      - name: Install MP4Box via Brew (Native ARM64)
        run: |
          # Varsayılan ARM64 Brew üzerinden kurulum
          brew install gpac
          cp $(which mp4box) bin/arm64/mp4box

      - name: Install MP4Box via Brew (Rosetta x86_64 Virtual)
        run: |
          # Intel mimarisi için izole (virtual) Homebrew kurulumu
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          
          # Rosetta Brew (/usr/local/bin/brew) üzerinden Intel MP4Box kurulumu
          arch -x86_64 /usr/local/bin/brew install gpac
          cp /usr/local/bin/mp4box bin/x86_64/mp4box

      - name: Create Universal Binaries (Lipo)
        run: |
          # Senin linklerinden gelen FFmpeg/FFprobe ve Brew'dan gelen MP4Box'ları birleştiriyoruz
          lipo -create bin/arm64/ffmpeg bin/x86_64/ffmpeg -output out/ffmpeg
          lipo -create bin/arm64/ffprobe bin/x86_64/ffprobe -output out/ffprobe
          lipo -create bin/arm64/mp4box bin/x86_64/mp4box -output out/mp4box
          
          chmod +x out/*
          
          echo "Final Doğrulama:"
          file out/ffmpeg
          file out/mp4box
          out/mp4box -version | head -n 1

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
          tag_name: latest
          name: Fusion Universal Tools
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
